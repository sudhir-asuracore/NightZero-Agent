[project]
name = "nightzero"
version = "0.1.0"
description = "Evidence-backed incident remediation demo"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin>=6.5.0",
  "google-adk>=1.0.0",
  "google-cloud-firestore>=2.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nightzero"]

[tool.unittest]
start-directory = "tests"
